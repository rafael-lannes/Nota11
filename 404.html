<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nota 11 - Carregando Perfil...</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var pathname = window.location.pathname || '';
      var origin = window.location.origin || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Divide os segmentos da URL
      var segments = pathname.split('/').filter(Boolean);

      // Não redirecionar se for arquivo estático ausente (.js, .css, .png, etc.)
      var last = segments.length > 0 ? segments[segments.length - 1] : '';
      if (/\.(js|css|png|jpg|jpeg|svg|webp|ico|json|map|woff|woff2|ttf)$/i.test(last)) {
        return;
      }

      var basePath = '/';
      var slug = '';

      if (segments.length >= 2) {
        // Exemplo: /Nota11/Ranesu -> basePath = /Nota11/, slug = Ranesu
        basePath = '/' + segments[0] + '/';
        slug = segments.slice(1).join('/');
      } else if (segments.length === 1) {
        if (segments[0].toLowerCase() === 'nota11') {
          basePath = '/Nota11/';
        } else {
          basePath = '/';
          slug = segments[0];
        }
      }

      if (slug) {
        var cleanSlug = decodeURIComponent(slug).replace(/\/+$/, '');
        var redirectUrl = origin + basePath + '?u=' + encodeURIComponent(cleanSlug) + (hash || '');
        window.location.replace(redirectUrl);
      } else {
        window.location.replace(origin + basePath);
      }
    })();
  </script>
  <style>
    body {
      background: #090a0f;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: rgba(18, 20, 28, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      color: #ffffff;
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 16px;
    }
    a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Carregando Perfil...</h1>
    <p>Redirecionando para a vitrine pública de jogos no Nota 11.</p>
    <a href="./">Ir para a página inicial</a>
  </div>
</body>
</html>
